source = ~/.config/omarchy/current/theme/hyprlock.conf

animations {
    enabled = false
}


background {
     path = ~/.config/omarchy/current/background
    blur_passes = 3
    blur_size = 6
}

input-field {
    size = 115, 30
    outline_thickness = 0
    dots_size = 0.3
    dots_space = 0.5
    dots_center = true
    inner_color = rgba(dddddd50)
    font_color = rgb(ffffff)
    hide_input = false
    rounding = -1
    placeholder_text = <span></span>
    fade_on_empty = true
    fade_timeout = 0
    check_color = rgb(255, 97, 97)
    fail_color = rgb(255, 97, 97)
    fail_transition = 300
    position = 0, -20
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = rgba(dddddd70)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}