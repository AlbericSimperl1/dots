animations {
    enabled = true

    # BEZIER CURVES
    # We hebben de overshot-curve aangepast (laatste getal naar 1.15) voor een duidelijkere bounce.
    # Ook is de start-versnelling wat feller gemaakt.
    bezier = overshotW, 0.15, 0.85, 0.1, 1.03
    bezier = overshot, 0.15, 0.85, 0.1, 1.1

    bezier = smoothOut, 0.25, 1, 0.5, 1  # Let op: de '8' in jouw config was waarschijnlijk een typfout!
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = softSnap, 0.4, 0, 0.2, 1
    bezier = fluent, 0.0, 0.0, 0.2, 1.0
    bezier = easeInOutExpo, 0.87, 0, 0.13, 1

    # WINDOW MOVEMENTS (Versneld van 5/4 naar 3 deciseconden)
    animation = windows, 1, 1, overshot, popin 80%
    animation = windowsIn, 1, 2.5, softSnap
    animation = windowsOut, 1, 1.5, softSnap
    animation = windowsMove, 1, 3, overshotW

    # LAYERS (Versneld naar 4 en 5)
    animation = layersIn, 1, 4, smoothIn
    animation = layersOut, 1, 5, softSnap

    # FADE ANIMATIONS (Versneld van 4 naar 2.5)
    animation = fade, 1, 2.5, smoothIn
    animation = fadeIn, 1, 2.5, smoothIn
    animation = fadeOut, 1, 2.5, smoothOut
    animation = fadeSwitch, 1, 2.5, smoothIn
    animation = fadeShadow, 1, 2.5, smoothIn
    animation = fadeDim, 1, 2.5, smoothIn
    animation = fadeDpms, 1, 2.5, smoothIn

    # WORKSPACES (Versneld van 5 naar 3.5 voor een snappy gevoel met de nieuwe overshot)
    animation = workspaces, 1, 2.5, softSnap, slidefadevert
    animation = specialWorkspace, 1, 3.5, overshot, slidefadevert 30%
}


dwindle {
    preserve_split = true
}
